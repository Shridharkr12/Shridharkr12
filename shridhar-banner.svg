<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Shridhar Kumar — Full-Stack Developer</title>
  <desc id="desc">A dark navy banner with electric blue systems-inspired geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#101b36"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1688ff" stop-opacity=".05"/>
      <stop offset=".55" stop-color="#1688ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#59d4ff" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#83a9e8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="1060" cy="170" rx="200" ry="125" fill="#087cff" opacity=".13" filter="url(#blur)"/>
  <path d="M705 360 1058 0h222v360Z" fill="url(#glow)" opacity=".68"/>
  <g fill="none" stroke="#318cff" stroke-opacity=".48" stroke-width="1.4">
    <path d="M760 259h135l44-45h92l54-54h98"/>
    <path d="M814 298h88l69-69h68l57-57h87" stroke-opacity=".3"/>
    <path d="M905 104h91l36 36h84l39 39h70" stroke-opacity=".28"/>
    <path d="M1006 67v45l38 38v47l-39 39v57" stroke-opacity=".22"/>
    <path d="M1155 67v49l-30 30v63l42 42v54" stroke-opacity=".24"/>
    <path d="M942 317h64l28-28h72" stroke-opacity=".34"/>
  </g>
  <g fill="#63caff">
    <circle cx="895" cy="259" r="4"/><circle cx="1031" cy="214" r="4"/>
    <circle cx="1144" cy="160" r="4"/><circle cx="996" cy="104" r="3"/>
    <circle cx="1120" cy="289" r="3"/><circle cx="1068" cy="140" r="3"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="76" y="94" fill="#72c8ff" font-size="14" font-weight="700" letter-spacing="4">SOFTWARE ENGINEERING · FULL STACK</text>
    <text x="72" y="174" fill="#f3f7ff" font-size="58" font-weight="750" letter-spacing="-1.8">Shridhar Kumar</text>
    <text x="76" y="220" fill="#aabbd8" font-size="22" font-weight="450">Building products across the stack.</text>
    <text x="76" y="254" fill="#aabbd8" font-size="22" font-weight="450">Exploring distributed systems and AI.</text>
  </g>
  <g transform="translate(77 302)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" letter-spacing="1.4">
    <rect width="90" height="28" rx="14" fill="#13284b" stroke="#2d5e9f" stroke-opacity=".7"/><text x="45" y="18" fill="#bddcff" text-anchor="middle">REACT</text>
    <rect x="100" width="112" height="28" rx="14" fill="#13284b" stroke="#2d5e9f" stroke-opacity=".7"/><text x="156" y="18" fill="#bddcff" text-anchor="middle">TYPESCRIPT</text>
    <rect x="222" width="74" height="28" rx="14" fill="#13284b" stroke="#2d5e9f" stroke-opacity=".7"/><text x="259" y="18" fill="#bddcff" text-anchor="middle">JAVA</text>
    <rect x="306" width="112" height="28" rx="14" fill="#13284b" stroke="#2d5e9f" stroke-opacity=".7"/><text x="362" y="18" fill="#bddcff" text-anchor="middle">SPRING BOOT</text>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="none" stroke="#8fb9ff" stroke-opacity=".15"/>
